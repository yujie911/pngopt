name: Release

# 推送版本标签时自动构建 Windows 可执行文件并创建 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建 Windows 版本
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -oE 'version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' cli.go | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VERSION"

      - name: 运行测试
        run: go test ./... -timeout 5m

      - name: 检查代码格式
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下文件未格式化:"; echo "$UNFORMATTED"; exit 1
          fi

      - name: 构建可执行文件
        shell: bash
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o pngopt.exe .

      - name: 校验版本号
        shell: bash
        run: |
          ACTUAL=$(./pngopt.exe -v | head -1 | awk '{print $2}')
          EXPECTED="${{ steps.ver.outputs.version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "版本号不一致: 期望 $EXPECTED, 实际 $ACTUAL"; exit 1
          fi
          echo "版本校验通过: $ACTUAL"

      - name: 打包
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cp pngopt.exe "pngopt-v${VERSION}-windows-amd64.exe"
          mkdir -p pkg
          cp pngopt.exe pkg/
          cp README.md LICENSE pkg/
          cd pkg
          zip -r "../pngopt-v${VERSION}-windows-amd64.zip" .

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pngopt-v${{ steps.ver.outputs.version }}-windows-amd64.exe
            pngopt-v${{ steps.ver.outputs.version }}-windows-amd64.zip
          generate_release_notes: true
          body: |
            ## pngopt v${{ steps.ver.outputs.version }}

            Windows 命令行 PNG 无损压缩工具，完整保留透明度通道。

            ### 快速开始

            ```
            pngopt.exe aaa.png          # 压缩后输出 aaa_opt.png
            pngopt.exe -i aaa.png -o out.png
            pngopt.exe ./images         # 批量压缩文件夹
            pngopt.exe -v               # 版本号
            ```

            ### 资产

            - `pngopt-v${{ steps.ver.outputs.version }}-windows-amd64.exe` —— 独立可执行文件
            - `pngopt-v${{ steps.ver.outputs.version }}-windows-amd64.zip` —— 含 exe / README / LICENSE

            ### 系统要求

            Windows x64，无需安装 Go 工具链，无 cgo 依赖。

            ### 许可

            MIT
